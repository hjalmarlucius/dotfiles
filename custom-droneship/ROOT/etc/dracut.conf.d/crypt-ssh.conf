# Unlock LUKS over SSH from the initramfs (dracut-crypt-ssh + dropbear).
# After a reboot: ssh -p 222 root@<host>, then run `unlock`.
# A port of its own, so ssh doesn't confuse this host key with sshd's.
dropbear_port="222"
# One fixed host key, which endos.py creates if missing. Without it every
# dracut rebuild would make a new key and ssh would warn.
dropbear_keytypes="ed25519"
dropbear_ed25519_key="/etc/dracut-crypt-ssh/ssh_host_ed25519_key"
# Public keys allowed to unlock (kept out of this repo). A list of its own,
# so a key that may unlock is not also a root login on the running system.
dropbear_acl="/etc/dracut-crypt-ssh/authorized_keys"
# The unlock helper runs cryptsetup; with systemd in the initramfs, dracut
# does not add it on its own.
install_items+=" /sbin/cryptsetup "
