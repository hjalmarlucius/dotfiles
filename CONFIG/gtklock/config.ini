[main]
gtk-theme-name=Adwaita-dark
time-format=%H:%M
start-hidden=1
modules=powerbar-module

[userinfo]
round-image=true
horizontal-layout=false
under-clock=true

[powerbar]
show-labels=true
linked-buttons=true
reboot-command=systemctl reboot
poweroff-command=systemctl poweroff
suspend-command=systemctl suspend
userswitch-command=
logout-command=swaymsg exit
