add_newline = true
right_format = """$cmd_duration\n"""

[line_break]
disabled = false

[time]
disabled = false

[cmd_duration]
disabled = true

[directory]
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "red"
before_repo_root_style = "cyan"
repo_root_format = """\
  [$before_root_path]\
  ($before_repo_root_style)\
  [$repo_root]\
  ($repo_root_style)\
  [$path]\
  ($style)\
  [$read_only]\
  ($read_only_style)\
   \
  """

[git_status]
disabled = true
