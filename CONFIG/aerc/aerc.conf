[general]
default-menu-cmd=fzf
default-save-path=~/Downloads
log-file=~/.cache/aerc/aerc.log
log-level=warn

[ui]
border-char-vertical="│"
border-char-horizontal="─"
styleset-name=catppuccin.frappe
sidebar-width=25
fuzzy-complete=true
timestamp-format=Mon 2006-01-02 15:04
this-day-time-format=15:04
this-week-time-format=Mon 15:04
this-year-time-format=02 Jan
mouse-enabled=true
tab-title-account=󰇮 {{.Account}} {{if .Unread "INBOX"}}({{.Unread "INBOX"}}){{end}}
dirlist-left=  {{.Folder}}
dirlist-right={{if .Unread}}{{humanReadable .Unread}}{{end}}
next-message-on-delete=true
dirlist-tree=true
dirlist-collapse=1
icon-unencrypted=
icon-encrypted=✔
icon-signed=✔
icon-signed-encrypted=✔
icon-unknown=✘
icon-invalid=⚠
reverse-thread-order=false
threading-enabled=true
msglist-scroll-offset=3
keyhint=true
auto-mark-read-split=true
completion-delay=100ms

[ui:folder~^(Sent|Sent Mail|Drafts)$]
index-columns=flags:4,name<20%,subject,date>=
column-name=To {{.To | names | join ", "}}

[viewer]
always-show-mime=true
pager=less -Rc

[compose]
address-book-cmd=khard email --parsable --remove-first-line %s | head -n 99
header-layout=To|From,Cc|Bcc,Subject
reply-to-self=false
empty-subject-warning=true
no-attachment-warning=^[^>]*(attach(ed|ment)|vedlagt|vedlegg)
file-picker-cmd=yazi --chooser-file=%f

[multipart-converters]
text/html=pandoc -f markdown+lists_without_preceding_blankline -t html

[filters]
text/plain=wrap -w 100 | colorize
text/calendar=calendar
text/html=html | colorize
#text/html=pandoc -f html -t plain | colorize
#text/html=! html
#text/*=bat -fP --file-name="$AERC_FILENAME"
message/delivery-status=colorize
message/rfc822=colorize
application/pdf=pdftotext - -l 10 -nopgbrk -q - | fmt -w $(tput cols)
#application/x-sh=bat -fP -l sh
#subject,~Git(hub|lab)=lolcat -f
#from,thatguywhodoesnothardwraphismessages=wrap -w 100 | colorize
.headers=colorize

[openers]
text/html=qutebrowser
application/x-pdf=zathura
application/pdf=zathura
image/*=qimgv
image/png=qimgv
image/jpg=qimgv
video/*=mpv
audio/*=mpv --no-video
text/calendar=footclient --app-id floating_shell --window-size-chars 80x45 khal import {}
text/*=footclient --app-id floating_shell --window-size-chars 80x45 nvim {}

[hooks]
aerc-startup=aerc :terminal khal interactive \
  && aerc :pin-tab \
  && aerc :change-tab hjarl
mail-received=notify-send "[$AERC_ACCOUNT/$AERC_FOLDER] New mail from $AERC_FROM_NAME" "$AERC_SUBJECT"
