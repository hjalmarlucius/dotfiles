# Global: lists, viewer. Contexts that run a program (editor, terminal) use
# $noinherit and bind no Ctrl+letter key, so that nvim, khal and shells get them.
<C-t> = :term<Enter>
? = :help keys<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-PgDn> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>

[messages]
! = :term<space>
$ = :term<space>
/ = :search<space>
| = :pipe<space>
. = :repeat<Enter>
\ = :filter<space>
u = :filter -u<Enter> # Only unread
<Esc> = :clear<Enter>

j = :next-message<Enter>
k = :prev-message<Enter>
<C-b> = :prev 100%<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>
<C-u> = :prev 50%<Enter>
gg = :select 0<Enter> # First message
G = :select -1<Enter>
n = :next-result<Enter>
N = :prev-result<Enter>
<C-o> = :change-tab -<Enter> # Last tab

J = :next-folder<Enter>
K = :prev-folder<Enter>
H = :collapse-folder<Enter>
L = :expand-folder<Enter>
ga = :cf Archive<Enter> # Archive
gf = :menu -adc fzf :cf -a<Enter> # Any folder
gi = :cf INBOX<Enter> # Inbox
gr = :check-mail<Enter> # Check for mail
gt = :cf Trash<Enter> # Trash

# Filters, Esc clears. Sender and subject are cut down to ASCII letters, digits
# and @._+- first, so a crafted header cannot inject commands; the thread
# filter matches every word of the subject.
fs = :filter -f {{replace `[^[:alnum:]@._+-]` "" (index (.From | emails) 0)}}<Enter> # Only this sender
fS = :filter -a {{replace `[^[:alnum:]@._+-]` "" (index (.From | emails) 0)}}<Enter> # Everything with this person
ft = :filter {{replace `[^[:alnum:]]+` " " .SubjectBase}}<Enter> # Only this thread

<Space> = :mark -t<Enter>:next-message<Enter>
v = :mark -t<Enter>
V = :mark -v<Enter>

<tab> = :fold -t<Enter>
T = :toggle-threads<Enter>
za = :fold -t<Enter> # Toggle fold
zc = :fold<Enter> # Fold
zo = :unfold<Enter> # Unfold
zM = :fold -a<Enter> # Fold all
zR = :unfold -a<Enter> # Unfold all
zb = :align bottom<Enter> # Cursor to bottom
zt = :align top<Enter> # Cursor to top
zz = :align center<Enter> # Cursor to center

<Enter> = :view<Enter>
s = :split<Enter>
S = :vsplit<Enter>
b = :bounce<space>
c = :compose<Enter>
r = :reply -aq<Enter>
R = :reply -q<Enter>
F = :forward -A<Enter>
gF = :forward -F<Enter> # Forward as attachment
aa = :archive flat<Enter> # Archive
A = :unmark -a<Enter>:mark -T<Enter>:archive flat<Enter>
dd = :read<Enter>:mv Trash<Enter> # Move to Trash
m = :menu -dc fzf :mv<Enter>
U = :read -t<Enter>
* = :flag -t<Enter>
X = :unsubscribe<Enter>
ia = :accept<Enter> # Accept invitation
it = :accept-tentative<Enter> # Accept tentatively
id = :decline<Enter> # Decline invitation
q = :quit<Enter>

[messages:account=^gmail$]
ga = :cf "All Mail"<Enter> # Archive
# The filters run in All Mail, which holds every folder. The sender must be
# read before the folder changes, so both steps go through aerc's IPC.
fs = :menu -b -c 'aerc :cf "All Mail" | grep -v DEBUG; aerc :filter -f {{replace `[^[:alnum:]@._+-]` "" (index (.From | emails) 0)}} | grep -v DEBUG; true' :echo<Enter> # Only this sender
fS = :menu -b -c 'aerc :cf "All Mail" | grep -v DEBUG; aerc :filter -a {{replace `[^[:alnum:]@._+-]` "" (index (.From | emails) 0)}} | grep -v DEBUG; true' :echo<Enter> # Everything with this person
ft = :menu -b -c 'aerc :cf "All Mail" | grep -v DEBUG; aerc :filter {{replace `[^[:alnum:]]+` " " .SubjectBase}} | grep -v DEBUG; true' :echo<Enter> # Only this thread

[messages:folder=^Drafts$]
<Enter> = :recall<Enter>

[messages:folder=^(Trash|Spam|Junk)$]
dd = :choose -o y 'Delete forever' delete-message<Enter> # Delete forever
D = :choose -o y 'Delete forever' delete-message<Enter>

[view]
# Unbound keys go to the pager (less)
/ = :toggle-key-passthrough<Enter>/
| = :pipe<space>
. = :repeat<Enter>
<tab> = :next-part<Enter>
<backtab> = :prev-part<Enter>
<C-o> = :change-tab -<Enter> # Last tab
J = :next-message<Enter>
K = :prev-message<Enter>
H = :toggle-headers<Enter>
f = :menu -lc fzf :open-link<Enter>
y = :copy-link <space>
o = :open<Enter>
O = :open<Enter>
S = :save<space>
gs = :save -a ~/Downloads/<Enter> # Save all attachments
q = :close<Enter>

r = :reply -aq<Enter>
R = :reply -q<Enter>
F = :forward -A<Enter>
gF = :forward -F<Enter> # Forward as attachment
aa = :archive flat<Enter> # Archive
A = :unmark -a<Enter>:mark -T<Enter>:archive flat<Enter>
dd = :read<Enter>:mv Trash<Enter> # Move to Trash
m = :menu -dc fzf :mv<Enter>
U = :read -t<Enter>
* = :flag -t<Enter>
X = :unsubscribe<Enter>
ia = :accept<Enter> # Accept invitation
it = :accept-tentative<Enter> # Accept tentatively
id = :decline<Enter> # Decline invitation

[view:folder=^(Trash|Spam|Junk)$]
dd = :choose -o y 'Delete forever' delete-message<Enter> # Delete forever
D = :choose -o y 'Delete forever' delete-message<Enter>

[view::passthrough]
$noinherit = true
$ex = <C-x>
<Esc> = :toggle-key-passthrough<Enter>

[compose]
# Keybindings used when the embedded terminal is not selected in the compose view
$complete = <C-e>
$ex = <C-x>
$noinherit = true
<A-n> = :switch-account -n<Enter>
<A-p> = :switch-account -p<Enter>
<C-n> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>
<C-PgDn> = :next-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-Up> = :prev-field<Enter>
<C-Down> = :next-field<Enter>
<backtab> = :prev-field<Enter>
<tab> = :next-field<Enter>

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
<C-PgDn> = :next-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-Up> = :prev-field<Enter>
<C-Down> = :next-field<Enter>

[compose::review]
y = :send<Enter> # Send
Y = :send -a flat<Enter> # Send and archive the message replied to
v = :preview<Enter> # Preview message
p = :postpone<Enter> # Postpone
h = :multipart text/html<Enter> # Add html from markdown
H = :multipart -d text/html<Enter> # Remove html
q = :choose -o d discard abort -o p postpone postpone<Enter> # Abort or postpone
e = :edit<Enter> # Edit (body and headers)
a = :attach -m<Enter> # Add attachments (yazi)
d = :detach<space> # Remove attachment
# s = :sign<Enter> # Toggle signing
# x = :encrypt<Enter> # Toggle encryption to all recipients

[terminal]
$noinherit = true
$ex = <C-x>
<C-PgDn> = :next-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
