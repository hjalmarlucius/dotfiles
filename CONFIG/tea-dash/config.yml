# yaml-language-server: $schema=/usr/share/tea-dash/schema.json
# Each view opens on everything the login can see, then one tab per
# repository (h/l or tab to switch). Launched inside one of these checkouts,
# the "All open" tab narrows to that repository (t toggles it).
instance:
  url: https://git.hjarl.com
  # the login of gt, from the keyring: gt auth login --host git.hjarl.com
  tokenCommand: gt auth token --host git.hjarl.com

defaults:
  view: prs
  refetchIntervalMinutes: 5

pager:
  diff: delta --paging always --pager "less -R"

prSections:
  - title: All open
    filter:
      state: open
  - title: core
    repo: Hjarl/hjarl-core
    filter:
      state: open
  - title: system
    repo: Hjarl/hjarl-system
    filter:
      state: open
  - title: dotfiles
    repo: henrik/dotfiles
    filter:
      state: open

issuesSections:
  - title: All open
    filter:
      state: open
  - title: core
    repo: Hjarl/hjarl-core
    filter:
      state: open
  - title: system
    repo: Hjarl/hjarl-system
    filter:
      state: open
  - title: dotfiles
    repo: henrik/dotfiles
    filter:
      state: open

notificationsSections:
  - title: Inbox

# Moving never changes the repository tab (n opens a number, see below):
#   j/k  rows in the list, or scroll the preview when it has focus
#   l/h  into the preview and back (both toggle: tea-dash has no
#        per-pane keys); enter and esc still work
#   J/K  next/previous row from either pane, keeping the preview tab
#   H/L  previous/next repository tab
#   [/]  preview tabs (Overview, Comments)
keybindings:
  # n: type a number, open that issue or PR of the selected row's repository
  # in the browser (Gitea sends /issues/N on to /pulls/N for pull requests).
  prs:
    - &open-number
      key: n
      name: "open #N in browser"
      command: >-
        printf 'Open #'; read -r n;
        case "$n" in ''|*[!0-9]*) exit 0;; esac;
        xdg-open "{{.InstanceURL}}/{{.RepoName}}/issues/$n" >/dev/null 2>&1
  issues:
    - *open-number
  universal:
    - key: l
      builtin: focusPreview
    - key: h
      builtin: focusPreview
    - key: J
      builtin: down
    - key: K
      builtin: up
    - key: H
      builtin: prevSection
    - key: L
      builtin: nextSection
