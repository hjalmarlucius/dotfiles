# yaml-language-server: $schema=/usr/share/tea-dash/schema.json
# Each view opens on everything the login can see, then one tab per
# repository (h/l or tab to switch). Launched inside one of these checkouts,
# the "All open" tab narrows to that repository (t toggles it).
instance:
  url: https://git.hjarl.com
  # the login of gt, from the keyring: gt auth login --host git.hjarl.com
  tokenCommand: gt auth token --host git.hjarl.com

defaults:
  view: prs
  refetchIntervalMinutes: 5

pager:
  diff: delta --paging always --pager "less -R"

prSections:
  - title: All open
    filter:
      state: open
  - title: core
    repo: Hjarl/hjarl-core
    filter:
      state: open
  - title: system
    repo: Hjarl/hjarl-system
    filter:
      state: open
  - title: dotfiles
    repo: henrik/dotfiles
    filter:
      state: open

issuesSections:
  - title: All open
    filter:
      state: open
  - title: core
    repo: Hjarl/hjarl-core
    filter:
      state: open
  - title: system
    repo: Hjarl/hjarl-system
    filter:
      state: open
  - title: dotfiles
    repo: henrik/dotfiles
    filter:
      state: open

notificationsSections:
  - title: Inbox
