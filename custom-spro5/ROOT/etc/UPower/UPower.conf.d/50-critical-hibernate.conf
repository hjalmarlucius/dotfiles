# Hibernate at a critical battery level. upower's default (Auto) picks hybrid
# sleep, which on these Surfaces (s2idle only) keeps draining the battery
# until it is empty, and a battery left at zero may never charge again.
[UPower]
PercentageLow=15.0
PercentageCritical=8.0
PercentageAction=5.0
CriticalPowerAction=Hibernate
